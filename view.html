<style>
:root{--blue:#2563eb;--deep:#12345b;--green:#16a34a;--red:#dc2626;--line:#bfdbfe;--bg:#e8f2ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#102a50}button,input,select{font:inherit}button{cursor:pointer;font-weight:800}.wrap{max-width:1500px;margin:auto;padding:14px}.head,.panel{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}.head h1{margin:0;text-align:center}.nav,.upload,.filters,.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:12px 18px;background:#eaf2ff;color:#12345b}.primary{background:var(--blue);color:#fff}.green{background:var(--green);color:#fff}.red{background:#fee2e2;color:#b91c1c}.purple{background:#7c3aed;color:#fff}.upload .btn{flex:1;min-width:210px;font-size:18px;padding:18px}.hidden{display:none!important}.hint{font-size:13px;color:#64748b;margin-top:7px}.preview-grid{display:grid;grid-template-columns:minmax(280px,1fr) minmax(480px,2fr);gap:12px}canvas{width:100%;max-height:520px;object-fit:contain;background:#eef2f7;border-radius:12px}.mask{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:center;margin-top:8px}.order-date-field{display:flex;align-items:center;gap:8px;font-weight:900}.order-date-field input{padding:10px;border:1px solid #aac1df;border-radius:9px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:1320px;background:#fff}th,td{border-bottom:1px solid #dbeafe;padding:7px;text-align:left;white-space:nowrap}th{background:#eff6ff;position:sticky;top:0;z-index:1}table th:nth-child(5),table td:nth-child(5){min-width:310px}td input,td select,.filter{width:100%;min-width:90px;padding:8px;border:1px solid #b9c9df;border-radius:8px}table td:nth-child(5) input{min-width:290px}.qty{width:75px}.status{font-weight:900}.ok{color:#15803d}.cancel{color:#b91c1c}.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#dbeafe;font-size:12px}.ship-confirm{display:flex;gap:6px;align-items:center;margin-top:7px}.ship-confirm .btn{padding:9px 12px}.doc{border:2px solid var(--line);border-radius:14px;background:#fff;margin:10px 0;overflow:hidden}.doc summary{padding:14px;font-weight:900;cursor:pointer;display:flex;gap:10px;align-items:center}.doc summary .grow{flex:1}.doc.cancelled{opacity:.7;border-color:#fecaca}.doc-body{padding:0 12px 12px}.registered-time{text-align:right;color:#94a3b8;font-size:10px;font-weight:500;margin-top:5px}.filter-grid{display:grid;grid-template-columns:repeat(9,minmax(115px,1fr));gap:6px;margin:10px 0}.filter-grid label{font-size:11px;font-weight:800}.filter-grid select{margin-top:3px}.notice{padding:10px;border-radius:10px;background:#fff7d6;color:#854d0e;font-weight:700}.modal-bg{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:15px;z-index:20}.modal-bg.open{display:flex}.modal{background:#fff;border-radius:16px;padding:18px;width:min(620px,100%);max-height:95vh;overflow:auto}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.form-grid label{font-size:12px;font-weight:800}.form-grid input{width:100%;padding:10px;border:1px solid #aac1df;border-radius:9px;margin-top:3px}.wide{grid-column:1/-1}@media(max-width:850px){.preview-grid{grid-template-columns:1fr}.filter-grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:8px}.head h1{font-size:23px}}
@media print{@page{size:A4 landscape;margin:8mm}body{background:#fff}.wrap{max-width:none;padding:0}.no-print,#previewPanel{display:none!important}.head,.panel,.doc{border:0;box-shadow:none;margin:0 0 8px;padding:6px}.doc{break-inside:avoid}.doc summary{padding:6px}.doc-body{padding:0}.table-wrap{overflow:visible;border:0}table{min-width:0;font-size:10px}th,td{padding:4px}.print-only{display:inline!important}}

.part-filter{position:relative;margin-top:3px;font-size:12px;font-weight:400}
.part-filter summary{padding:8px;border:1px solid #b9c9df;border-radius:8px;background:white;cursor:pointer;list-style:none}
.part-filter summary::after{content:' ▼';float:right}
.part-filter-menu{position:absolute;top:100%;left:0;width:340px;max-width:80vw;background:white;border:1px solid #b9c9df;border-radius:8px;padding:10px;z-index:20;box-shadow:0 4px 16px #0002}
.part-filter-options{max-height:300px;overflow:auto;margin-top:8px}
.filter-grid .part-filter-option{display:flex;align-items:center;gap:8px;padding:7px 3px;font-size:12px;font-weight:400;cursor:pointer;overflow-wrap:anywhere}
.part-filter-option input{width:auto;flex-shrink:0;margin:0}

<body><div class="wrap"><div class="head"><h1>支給品管理状況</h1><div class="nav no-print"><button class="btn" onclick="backToMaterials()">← 材料発注管理へ戻る</button><button class="btn" onclick="loadData()">再読み込み</button><button class="btn" onclick="window.print()">印刷</button><button class="btn green" onclick="exportExcel()">Excel出力</button></div><div class="hint no-print">閲覧専用・登録内容の変更は管理者が行います。</div></div><div class="panel no-print"><div class="filters"><button class="btn" data-view="active" onclick="setView('active')">有効のみ</button><button class="btn primary" data-view="unshipped" onclick="setView('unshipped')">未出荷のみ</button><button class="btn" data-view="shipped" onclick="setView('shipped')">出荷済のみ</button><button class="btn" data-view="cancelled" onclick="setView('cancelled')">取消済み</button><button class="btn" data-view="all" onclick="setView('all')">すべて</button><button class="btn" onclick="clearFilters()">列フィルター解除</button></div><div class="filters" style="margin-top:10px"><span>納期順：</span><button class="btn" data-due-sort="asc" aria-pressed="false" onclick="setDueSort('asc')">納期が早い順</button><button class="btn" data-due-sort="desc" aria-pressed="false" onclick="setDueSort('desc')">納期が遅い順</button><span class="hint">もう一度押すと元の順序に戻ります</span></div><div id="filterGrid" class="filter-grid"></div><div id="countText" class="hint"></div></div>
<div id="documents"></div></div><script>
const CONFIG=window.TAJIMA_CONFIG||{},SUPABASE_ENDPOINT=CONFIG.SUPABASE_URL||"",KEY=CONFIG.SUPABASE_KEY||"";
const DOC_API=`${SUPABASE_ENDPOINT}/rest/v1/supplied_documents`,ITEM_API=`${SUPABASE_ENDPOINT}/rest/v1/supplied_items`;
const COLS=[['order_date','注文日'],['order_prefix','発注区分'],['order_no_norm','発注番号'],['property_no','物件No.'],['due_date','納期'],['unit_no','ユニット'],['part_code_norm','部品コード'],['item_name','品名'],['shipped','出荷状態']];
let documents=[],items=[],view="unshipped",filters={};
let dueSort="";
function h(){return {'apikey':KEY,'Authorization':`Bearer ${KEY}`,'Content-Type':'application/json','Prefer':'return=representation'}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cleanUnit(v){return String(v??'').replace(/:?\b(?:unselected|unknown|null|n\/?a)\b:?/gi,'').trim()}
function cleanItemName(v){return String(v??'').normalize('NFKC').replace(/[\s\u3000]+/g,'').trim()}
function filterCanon(v){return String(v??'').normalize('NFKC').replace(/[\u200B-\u200D\uFEFF\s\u3000]+/g,'').replace(/[‐‑‒–—―ー]/g,'-').toUpperCase()}
function dateVal(v){const s=String(v||'').trim().replace(/[.\/]/g,'-');let m=s.match(/^(\d{2,4})-(\d{1,2})-(\d{1,2})$/);if(!m)return '';let y=Number(m[1]);if(y<100)y+=2000;return `${y}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`}
function backToMaterials(){localStorage.setItem('tajima_section','materials');location.href='https://coolachin94-blip.github.io/TAJIMA-PRODUCTION/'}
async function get(api){const r=await fetch(api,{headers:h(),cache:'no-store'});if(!r.ok)throw Error(await r.text());return r.json()}
async function loadData(){if(!SUPABASE_ENDPOINT||!KEY){alert('config.jsの設定を確認してください');return}try{[documents,items]=await Promise.all([get(`${DOC_API}?select=*&order=created_at.desc`),get(`${ITEM_API}?select=*&order=created_at.desc`)]);buildFilters();draw()}catch(e){document.getElementById('documents').innerHTML='';alert('支給品データ読み込みエラー: '+e.message)}}
function setView(v){view=v;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('primary',b.dataset.view===v));draw()}
function clearFilters(){filters={};buildFilters();draw()}
function itemValue(x,k){if(k==='shipped')return x.shipped_at?'出荷済':'未出荷';if(k==='order_date')return documents.find(d=>Number(d.id)===Number(x.document_id))?.order_date||'';return x[k]??''}
function partCodeSelection(){const v=filters.part_code_norm;return Array.isArray(v)?v:v?[v]:[]}
function setPartCodeFilter(value,checked){const selected=new Set(partCodeSelection());if(checked)selected.add(value);else selected.delete(value);filters.part_code_norm=[...selected];updatePartCodeSummary();draw()}
function clearPartCodeFilter(){filters.part_code_norm=[];document.querySelectorAll('#partCodeFilter input[type="checkbox"]').forEach(c=>c.checked=false);updatePartCodeSummary();draw()}
function updatePartCodeSummary(){const summary=document.getElementById('partCodeSummary');if(summary)summary.textContent=partCodeSelection().length?`${partCodeSelection().length}件選択`:'すべて'}
function buildFilters(){filterGrid.innerHTML=COLS.map(([k,label])=>{const map=new Map();for(const x of items.filter(x=>!x.cancelled_at)){const raw=String(itemValue(x,k)||''),key=filterCanon(raw);if(key&&!map.has(key))map.set(key,k==='item_name'?cleanItemName(raw):raw.trim())}const vals=[...map.entries()].sort((a,b)=>a[1].localeCompare(b[1],'ja',{numeric:true}));if(k==='part_code_norm'){const selected=partCodeSelection();return `<div><span style="font-size:11px;font-weight:800">${label}（複数選択可）</span><details id="partCodeFilter" class="part-filter"><summary id="partCodeSummary">${selected.length?`${selected.length}件選択`:'すべて'}</summary><div class="part-filter-menu"><button class="btn" onclick="clearPartCodeFilter()">選択解除</button><div class="part-filter-options">${vals.map(([key,name])=>`<label class="part-filter-option"><input type="checkbox" value="${esc(key)}" ${selected.includes(key)?'checked':''} onchange="setPartCodeFilter(this.value,this.checked)"><span>${esc(name)}</span></label>`).join('')||'部品コードなし'}</div></div></details></div>`}return `<label>${label} ▼<select class="filter" onchange="filters['${k}']=this.value;draw()"><option value="">すべて</option>${vals.map(([key,name])=>`<option value="${esc(key)}" ${filters[k]===key?'selected':''}>${esc(name)}</option>`).join('')}</select></label>`}).join('')}
function visibleItem(x){if(view==='active'&&x.cancelled_at)return false;if(view==='unshipped'&&(x.cancelled_at||x.shipped_at))return false;if(view==='shipped'&&(x.cancelled_at||!x.shipped_at))return false;if(view==='cancelled'&&!x.cancelled_at)return false;return Object.entries(filters).every(([k,v])=>Array.isArray(v)?!v.length||v.includes(filterCanon(itemValue(x,k))):!v||filterCanon(itemValue(x,k))===v)}
function rowOrder(a,b){const ar=Number(a.source_row)||Number.MAX_SAFE_INTEGER,br=Number(b.source_row)||Number.MAX_SAFE_INTEGER;return ar-br||Number(a.id)-Number(b.id)}
function setDueSort(value){dueSort=dueSort===value?'':value;document.querySelectorAll('[data-due-sort]').forEach(b=>{const selected=b.dataset.dueSort===dueSort;b.classList.toggle('primary',selected);b.setAttribute('aria-pressed',String(selected))});draw()}
function dueSortKey(x){const value=dateVal(String(x.due_date||''));return value||''}
function compareDue(a,b){const av=dueSortKey(a),bv=dueSortKey(b);if(!av&&!bv)return 0;if(!av)return 1;if(!bv)return -1;return av.localeCompare(bv)*(dueSort==='desc'?-1:1)}
function orderedVisibleItems(){const list=items.filter(visibleItem),original=documents.flatMap(d=>list.filter(x=>Number(x.document_id)===Number(d.id)).sort(rowOrder));return dueSort?original.sort(compareDue):original}
function draw(){const list=orderedVisibleItems(),ids=new Set(list.map(x=>Number(x.document_id)));const docs=documents.filter(d=>ids.has(Number(d.id))||(view==='cancelled'&&d.cancelled_at));countText.textContent=`表示 ${list.length}件 / 全${items.length}件`;let html='';if(dueSort){const byId=new Map(documents.map(d=>[Number(d.id),d]));const groups=[];for(const x of list){const last=groups[groups.length-1];if(last&&Number(last.doc.id)===Number(x.document_id))last.rows.push(x);else{const doc=byId.get(Number(x.document_id));if(doc)groups.push({doc,rows:[x]})}}html=groups.map(g=>drawDoc(g.doc,g.rows)).join('');if(view==='cancelled')html+=docs.filter(d=>!ids.has(Number(d.id))).map(d=>drawDoc(d,[])).join('')}else html=docs.map(d=>drawDoc(d,list.filter(x=>Number(x.document_id)===Number(d.id)))).join('');document.getElementById('documents').innerHTML=html||'<div class="panel">該当データなし</div>'}
function csv(v){return `"${String(v??'').replace(/"/g,'""')}"`}
function exportExcel(){const list=orderedVisibleItems(),head=['注文日','発注番号','物件No.','納期','ユニット','部品コード','品名','注文数','出荷状態'],body=list.map(x=>[itemValue(x,'order_date'),x.order_no_norm,x.property_no,x.due_date||'',cleanUnit(x.unit_no),x.part_code_norm,cleanItemName(x.item_name),Number(x.quantity)||0,x.shipped_at?'出荷済':'未出荷']);const text='\uFEFF'+[head,...body].map(r=>r.map(csv).join(',')).join('\r\n'),a=document.createElement('a');a.href=globalThis.URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download=`支給品一覧_${new Date().toISOString().slice(0,10)}.csv`;a.click();setTimeout(()=>globalThis.URL.revokeObjectURL(a.href),1000)}
function drawDoc(d,rows){const cancelled=!!d.cancelled_at,temp=d.source_type==='manual_temp';return `<details class="doc ${cancelled?'cancelled':''}" open><summary><span class="grow">注文日 ${esc(d.order_date||'未設定')}　<span class="badge">${rows.length}件</span> ${temp?'<span class="badge temp">仮登録・注文書待ち</span>':''} ${cancelled?'<span class="status cancel">取消済み</span>':''}</span></summary><div class="doc-body"><div class="table-wrap"><table><thead><tr><th>発注番号</th><th>物件No.</th><th>納期</th><th>ユニット</th><th>部品コード</th><th>品名</th><th>注文数</th><th>出荷</th></tr></thead><tbody>${rows.map(drawItem).join('')}</tbody></table></div></div></details>`}
function drawItem(x){return `<tr class="${x.cancelled_at?'cancelled':''}"><td>${esc(x.order_no_norm)}</td><td>${esc(x.property_no)}</td><td>${esc(x.due_date||'')}</td><td>${esc(cleanUnit(x.unit_no))}</td><td>${esc(x.part_code_norm)}</td><td>${esc(cleanItemName(x.item_name))}</td><td>${Number(x.quantity)||0}</td><td><span class="status">${x.shipped_at?'O 出荷済':'X 未出荷'}</span><div class="hint">${x.shipped_at?new Date(x.shipped_at).toLocaleDateString('ja-JP'):''}</div></td></tr>`}
loadData();
</script></body></html>
