<body><div class="wrap">
<div class="head"><h1>支給品管理</h1><div class="nav no-print"><button class="btn" onclick="backToMaterials()">← 材料発注管理へ戻る</button><button class="btn" onclick="loadData()">再読み込み</button><button class="btn" onclick="window.print()">印刷</button><button class="btn green" onclick="exportExcel()">Excel出力</button></div><div class="hint no-print">原本画像と指示単価は保存しません。登録前に必ず認識結果を確認してください。</div></div>

<div class="panel no-print">
  <div class="upload"><button class="btn primary" onclick="imageInput.click()">画像ファイルを選択</button><button class="btn purple" onclick="pdfInput.click()">PDFを選択（複数ページ対応）</button></div>
  <input id="imageInput" class="hidden" type="file" accept="image/jpeg,image/png,image/webp"><input id="pdfInput" class="hidden" type="file" accept="application/pdf,.pdf">
  <div class="actions" style="margin-top:10px"><button class="btn orange" onclick="openManualOrder()">＋ 注文を直接登録</button></div>
  <div class="hint">画像またはPDFを選択すると、指示単価の列を端末内で隠してからOCRへ送信します。PDFはページごとに確認できます。</div>
</div>

<div id="previewPanel" class="panel hidden"><div class="page-dots" id="pageDots"></div><div class="page-nav"><button class="btn" onclick="changePage(-1)">◀ 前へ</button><span id="pageState" class="page-state"></span><button class="btn" onclick="changePage(1)">次へ ▶</button></div><div class="preview-grid"><div><canvas id="previewCanvas"></canvas><div class="mask"><input id="maskSlider" type="range" min="75" max="96" value="88"><b id="maskLabel">右端12%除外</b></div><div class="mask"><input id="maskTopSlider" type="range" min="8" max="35" value="22"><b id="maskTopLabel">上部22%表示</b></div><div class="hint">この除外範囲はPDFの全ページに共通で適用されます。</div><button id="ocrBtn" class="btn primary" style="width:100%;margin-top:10px" onclick="runOcrAll()">全ページの文字を読み取る</button><button class="btn" style="width:100%;margin-top:8px" onclick="runOcrCurrent()">このページだけ再認識</button></div><div><div id="ocrState" class="notice">除外範囲を確認して「全ページの文字を読み取る」を押してください。</div><div id="draftArea" class="hidden"><div class="actions" style="margin:10px 0"><label class="order-date-field">注文日 <input id="draftOrderDate" type="date" onchange="setPageDate(this.value)"></label><button class="btn" onclick="addDraftRow()">＋ 行追加</button><button class="btn green" onclick="confirmPage()">このページを確認完了</button><button class="btn green" id="saveAllBtn" onclick="saveAllPages()">全ページを登録</button><button class="btn red" onclick="closePreview()">取消</button></div><div class="table-wrap"><table><thead><tr><th>発注番号</th><th>物件No.</th><th>納期</th><th>ユニット</th><th>部品コード</th><th>品名</th><th>注文数</th><th>登録方法</th><th></th></tr></thead><tbody id="draftBody"></tbody></table></div></div></div></div></div>

<div class="panel no-print"><div class="filters"><button class="btn" data-view="active" onclick="setView('active')">有効のみ</button><button class="btn primary" data-view="unshipped" onclick="setView('unshipped')">未出荷のみ</button><button class="btn" data-view="shipped" onclick="setView('shipped')">出荷済のみ</button><button class="btn" data-view="cancelled" onclick="setView('cancelled')">取消済み</button><button class="btn" data-view="all" onclick="setView('all')">すべて</button><button class="btn" onclick="clearFilters()">列フィルター解除</button></div><div id="filterGrid" class="filter-grid"></div><div id="countText" class="hint"></div></div>
<div id="documents"></div>
</div>

<div id="editModal" class="modal-bg"><div class="modal"><h2>支給品データ修正</h2><input id="editId" type="hidden"><div id="editFields" class="form-grid"></div><div class="actions" style="margin-top:15px"><button class="btn" onclick="closeEdit()">閉じる</button><button class="btn green" onclick="saveEdit()">修正を保存</button></div></div></div>
<div id="manualModal" class="modal-bg"><div class="modal"><h2>注文を直接登録（仮登録）</h2><div class="form-grid"><label class="wide">既存の部品コード<select id="manualMaster" onchange="fillManualMaster()"></select></label><label>注文日<input id="manualOrderDate" type="date"></label><label>納期<input id="manualDueDate" type="date"></label><label>発注番号（未定可）<input id="manualOrderNo"></label><label>物件No.<input id="manualProperty"></label><label>ユニット<input id="manualUnit"></label><label>部品コード<input id="manualPart"></label><label class="wide">品名<input id="manualName"></label><label>注文数<input id="manualQty" type="number" min="0" step="0.01" value="1"></label></div><div class="actions" style="margin-top:15px"><button class="btn" onclick="closeManualOrder()">閉じる</button><button class="btn green" onclick="saveManualOrder()">仮登録する</button></div></div></div>
<div id="replaceModal" class="modal-bg"><div class="modal"><h2>仮登録と入替</h2><input id="replaceRowIndex" type="hidden"><div id="replaceChoices"></div><div class="actions" style="margin-top:15px"><button class="btn" onclick="closeReplace()">閉じる</button></div></div></div>
<script>
const CONFIG=window.TAJIMA_CONFIG||{},URL=CONFIG.SUPABASE_URL||"",KEY=CONFIG.SUPABASE_KEY||"";
const DOC_API=`${URL}/rest/v1/supplied_documents`,ITEM_API=`${URL}/rest/v1/supplied_items`;
const COLS=[['order_date','注文日'],['order_prefix','発注区分'],['order_no_norm','発注番号'],['property_no','物件No.'],['due_date','納期'],['unit_no','ユニット'],['part_code_norm','部品コード'],['item_name','品名'],['shipped','出荷状態']];
let documents=[],items=[],view='unshipped',filters={},sourceFile=null,sourceType='image',pages=[],pageIndex=0,pendingShipId=null;
function h(){return {'apikey':KEY,'Authorization':`Bearer ${KEY}`,'Content-Type':'application/json','Prefer':'return=representation'}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(v){return String(v??'').normalize('NFKC').replace(/[\s\u3000]+/g,'').replace(/[‐‑‒–—―ー]/g,'-').toUpperCase()}
function cleanUnit(v){return String(v??'').replace(/:?\b(?:unselected|unknown|null|n\/?a)\b:?/gi,'').trim()}
function cleanItemName(v){return String(v??'').normalize('NFKC').replace(/[\s\u3000]+/g,'').trim()}
function filterCanon(v){return String(v??'').normalize('NFKC').replace(/[\u200B-\u200D\uFEFF\s\u3000]+/g,'').replace(/[‐‑‒–—―ー]/g,'-').toUpperCase()}
function prefix(v){const n=norm(v);return /^[A-Z]/.test(n)?n[0]:''}
function backToMaterials(){localStorage.setItem('tajima_section','materials');location.href='https://coolachin94-blip.github.io/TAJIMA-PRODUCTION/'}
imageInput.onchange=e=>pickImage(e);pdfInput.onchange=e=>pickPdf(e);maskSlider.oninput=()=>{maskLabel.textContent=`右端${100-maskSlider.value}%除外`;drawMaskedPreview()};maskTopSlider.oninput=()=>{maskTopLabel.textContent=`上部${maskTopSlider.value}%表示`;drawMaskedPreview()};
function newPage(canvas){return {canvas,draft:[],orderDate:'',status:'未認識',confirmed:false,error:''}}
function showPreview(){pageIndex=0;previewPanel.classList.remove('hidden');draftArea.classList.add('hidden');renderPage();previewPanel.scrollIntoView({behavior:'smooth'})}
function pickImage(e){const f=e.target.files?.[0];e.target.value='';if(!f)return;sourceFile=f;sourceType='image';const img=new Image();img.onload=()=>{const max=1800,scale=Math.min(1,max/img.width),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);pages=[newPage(c)];showPreview()};img.src=globalThis.URL.createObjectURL(f)}
async function pickPdf(e){const f=e.target.files?.[0];e.target.value='';if(!f)return;if(!globalThis.pdfjsLib){alert('PDF読込ライブラリを読み込めませんでした。インターネット接続を確認してください。');return}sourceFile=f;sourceType='pdf';pages=[];ocrState.textContent='PDFを読み込んでいます…';previewPanel.classList.remove('hidden');try{const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;for(let n=1;n<=pdf.numPages;n++){ocrState.textContent=`PDF ${n}/${pdf.numPages}ページを準備中…`;const p=await pdf.getPage(n),v=p.getViewport({scale:1});const scale=Math.min(2,1800/v.width),viewport=p.getViewport({scale}),c=document.createElement('canvas');c.width=Math.ceil(viewport.width);c.height=Math.ceil(viewport.height);await p.render({canvasContext:c.getContext('2d'),viewport}).promise;pages.push(newPage(c))}showPreview();ocrState.textContent=`PDF ${pages.length}ページを読み込みました。除外範囲を確認してください。`}catch(err){alert('PDF読込エラー: '+err.message);closePreview()}}
function currentPage(){return pages[pageIndex]}
function changePage(d){if(!pages.length)return;pageIndex=Math.max(0,Math.min(pages.length-1,pageIndex+d));renderPage()}
function goPage(i){pageIndex=i;renderPage()}
function renderPage(){const p=currentPage();if(!p)return;drawMaskedPreview();pageState.textContent=`${pageIndex+1} / ${pages.length}ページ`;pageDots.innerHTML=pages.map((x,i)=>`<button class="page-dot ${x.confirmed?'done':''} ${i===pageIndex?'current':''}" onclick="goPage(${i})">${i+1}${x.confirmed?' ✓':''}</button>`).join('');draftOrderDate.value=p.orderDate||'';if(p.status!=='未認識'){draftArea.classList.remove('hidden');drawDraft()}else draftArea.classList.add('hidden');ocrState.textContent=p.error?`OCRエラー: ${p.error}`:`${pageIndex+1}ページ：${p.status}`;saveAllBtn.disabled=!pages.length||pages.some(x=>!x.confirmed)}
function drawMaskedPreview(){const p=currentPage();if(!p)return;previewCanvas.width=p.canvas.width;previewCanvas.height=p.canvas.height;const c=previewCanvas.getContext('2d');c.drawImage(p.canvas,0,0);const x=previewCanvas.width*Number(maskSlider.value)/100,y=previewCanvas.height*Number(maskTopSlider.value)/100;c.fillStyle='#4b5563';c.fillRect(x,y,previewCanvas.width-x,previewCanvas.height-y);c.fillStyle='#fff';c.font=`bold ${Math.max(18,previewCanvas.width/45)}px sans-serif`;c.fillText('指示単価 除外',x+8,y+30)}
function pageBase64(p){const c=document.createElement('canvas');c.width=p.canvas.width;c.height=p.canvas.height;const x=c.width*Number(maskSlider.value)/100,y=c.height*Number(maskTopSlider.value)/100,g=c.getContext('2d');g.drawImage(p.canvas,0,0);g.fillStyle='#fff';g.fillRect(x,y,c.width-x,c.height-y);return c.toDataURL('image/jpeg',.86).split(',')[1]}
async function recognizePage(i){const p=pages[i];p.status='認識中';p.confirmed=false;p.error='';pageIndex=i;renderPage();const r=await fetch(`${URL}/functions/v1/ocr-supplied-goods`,{method:'POST',headers:{'apikey':KEY,'Authorization':`Bearer ${KEY}`,'Content-Type':'application/json'},body:JSON.stringify({image_base64:pageBase64(p),mime_type:'image/jpeg'})});const text=await r.text();if(!r.ok)throw Error(text);const out=JSON.parse(text);p.draft=(out.rows||[]).map(cleanDraft);p.orderDate=dateVal(out.order_date);if(!p.draft.length)p.draft.push(cleanDraft());p.status='認識完了'}
async function runOcrAll(){if(!pages.length)return;ocrBtn.disabled=true;try{for(let i=0;i<pages.length;i++){try{await recognizePage(i)}catch(e){pages[i].status='認識失敗';pages[i].error=e.message}}pageIndex=0;renderPage()}finally{ocrBtn.disabled=false}}
async function runOcrCurrent(){if(!currentPage())return;try{await recognizePage(pageIndex)}catch(e){currentPage().status='認識失敗';currentPage().error=e.message}renderPage()}
function cleanDraft(r={}){return {order_no:r.order_no||'',property_no:r.property_no||'',due_date:dateVal(r.due_date),unit_no:cleanUnit(r.unit_no),part_code:r.part_code||'',item_name:cleanItemName(r.item_name),quantity:Number(r.quantity)||1,replaceId:null}}
function dateVal(v){const s=String(v||'').trim().replace(/[.\/]/g,'-');let m=s.match(/^(\d{2,4})-(\d{1,2})-(\d{1,2})$/);if(!m)return '';let y=Number(m[1]);if(y<100)y+=2000;return `${y}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`}
function setPageDate(v){currentPage().orderDate=v;currentPage().confirmed=false;renderPage()}
function addDraftRow(){currentPage().draft.push(cleanDraft());currentPage().confirmed=false;drawDraft()}
function setDraft(i,k,v){const r=currentPage().draft[i];r[k]=k==='quantity'?Number(v)||0:v;currentPage().confirmed=false;saveAllBtn.disabled=true}
function removeDraft(i){currentPage().draft.splice(i,1);currentPage().confirmed=false;drawDraft()}
function levenshtein(a,b){const m=Array.from({length:b.length+1},(_,i)=>[i]);for(let j=0;j<=a.length;j++)m[0][j]=j;for(let i=1;i<=b.length;i++)for(let j=1;j<=a.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[j-1]===b[i-1]?0:1));return m[b.length][a.length]}
function suggestion(k,v){const value=k==='part_code'?norm(v):cleanItemName(v);if(!value)return null;const vals=[...new Set(items.filter(x=>!x.cancelled_at).map(x=>k==='part_code'?x.part_code_norm:cleanItemName(x.item_name)).filter(Boolean))];if(vals.includes(value))return {exact:true};let best=null;for(const x of vals){const d=levenshtein(value,x),ratio=1-d/Math.max(value.length,x.length);const ok=k==='part_code'?(Math.abs(value.length-x.length)<=1&&d===1):(Math.max(value.length,x.length)>=4&&ratio>=.9);if(ok&&(!best||d<best.d))best={value:x,d}}return best||{newValue:true}}
function applySuggestion(i,k,v){currentPage().draft[i][k]=v;currentPage().confirmed=false;drawDraft()}
function warningHtml(i,k,v){const s=suggestion(k,v);if(!s||s.exact)return '';if(s.value)return `<span class="suggestion">類似候補：<button onclick="applySuggestion(${i},'${k}','${esc(s.value)}')">${esc(s.value)}</button></span>`;return `<span class="new-mark">新規候補</span>`}
function inputClass(k,v){const s=suggestion(k,v);return s&&s.value?'suspect-input':''}
function drawDraft(){const p=currentPage();draftOrderDate.value=p.orderDate||'';draftBody.innerHTML=p.draft.map((r,i)=>`<tr><td><input value="${esc(r.order_no)}" oninput="setDraft(${i},'order_no',this.value)"></td><td><input value="${esc(r.property_no)}" oninput="setDraft(${i},'property_no',this.value)"></td><td><input type="date" value="${esc(r.due_date)}" oninput="setDraft(${i},'due_date',this.value)"></td><td><input value="${esc(r.unit_no)}" oninput="setDraft(${i},'unit_no',this.value)"></td><td><input class="${inputClass('part_code',r.part_code)}" value="${esc(r.part_code)}" oninput="setDraft(${i},'part_code',this.value)" onchange="drawDraft()">${warningHtml(i,'part_code',r.part_code)}</td><td><input class="${inputClass('item_name',r.item_name)}" value="${esc(r.item_name)}" oninput="setDraft(${i},'item_name',this.value)" onchange="drawDraft()">${warningHtml(i,'item_name',r.item_name)}</td><td><input class="qty" type="number" min="0" step="0.01" value="${r.quantity}" oninput="setDraft(${i},'quantity',this.value)"></td><td><button class="btn ${r.replaceId?'purple':''}" onclick="openReplace(${i})">${r.replaceId?'仮登録と入替':'登録方法を選択'}</button>${r.replaceId?`<div class="replace-note">仮登録ID ${r.replaceId} と入替</div>`:'<div class="hint">通常は新規登録</div>'}</td><td><button class="btn red" onclick="removeDraft(${i})">除外</button></td></tr>`).join('')}
function confirmPage(){const p=currentPage(),rows=p.draft.filter(r=>norm(r.order_no)||norm(r.part_code)||r.item_name.trim());if(!rows.length){alert('このページに登録する行がありません');return}p.confirmed=true;p.status='確認完了';renderPage();if(pageIndex<pages.length-1){pageIndex++;renderPage()}}
function rowPayload(r,docId,rowNo){return {document_id:docId,order_no_raw:r.order_no,order_no_norm:norm(r.order_no),order_prefix:prefix(r.order_no),property_no:r.property_no.trim(),due_date:r.due_date||null,unit_no:cleanUnit(r.unit_no),part_code_raw:r.part_code,part_code_norm:norm(r.part_code),item_name:cleanItemName(r.item_name),quantity:Number(r.quantity)||0,source_row:rowNo,updated_at:new Date().toISOString()}}
async function saveAllPages(){if(pages.some(p=>!p.confirmed)){alert('すべてのページを確認完了にしてください');return}const total=pages.reduce((n,p)=>n+p.draft.filter(r=>norm(r.order_no)||norm(r.part_code)||r.item_name.trim()).length,0);if(!confirm(`${pages.length}ページ・${total}件を登録しますか？`))return;try{for(let pi=0;pi<pages.length;pi++){const p=pages[pi],rows=p.draft.filter(r=>norm(r.order_no)||norm(r.part_code)||r.item_name.trim());const dr=await fetch(DOC_API,{method:'POST',headers:h(),body:JSON.stringify({source_type:sourceType,original_name:sourceFile?.name?`${sourceFile.name}${pages.length>1?` p.${pi+1}`:''}`:null,order_date:p.orderDate||null})});if(!dr.ok)throw Error(await dr.text());const doc=(await dr.json())[0],fresh=[];for(let i=0;i<rows.length;i++){const payload=rowPayload(rows[i],doc.id,i+1);if(rows[i].replaceId)await patch(`${ITEM_API}?id=eq.${rows[i].replaceId}`,payload);else fresh.push(payload)}if(fresh.length){const ir=await fetch(ITEM_API,{method:'POST',headers:h(),body:JSON.stringify(fresh)});if(!ir.ok)throw Error(await ir.text())}}alert('登録しました');closePreview();await loadData()}catch(e){alert('登録エラー: '+e.message)}}
function closePreview(){previewPanel.classList.add('hidden');sourceFile=null;pages=[];pageIndex=0;draftOrderDate.value=''}
async function get(api){const r=await fetch(api,{headers:h(),cache:'no-store'});if(!r.ok)throw Error(await r.text());return r.json()}
async function loadData(){if(!URL||!KEY){alert('config.jsの設定を確認してください');return}try{[documents,items]=await Promise.all([get(`${DOC_API}?select=*&order=created_at.desc`),get(`${ITEM_API}?select=*&order=created_at.desc`)]);buildFilters();draw()}catch(e){document.getElementById('documents').innerHTML='';alert('支給品データ読み込みエラー: '+e.message)}}
function setView(v){view=v;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('primary',b.dataset.view===v));draw()}
function clearFilters(){filters={};buildFilters();draw()}
function itemValue(x,k){if(k==='shipped')return x.shipped_at?'出荷済':'未出荷';if(k==='order_date')return documents.find(d=>Number(d.id)===Number(x.document_id))?.order_date||'';return x[k]??''}
function buildFilters(){filterGrid.innerHTML=COLS.map(([k,label])=>{const map=new Map();for(const x of items.filter(x=>!x.cancelled_at)){const raw=String(itemValue(x,k)||''),key=filterCanon(raw);if(key&&!map.has(key))map.set(key,k==='item_name'?cleanItemName(raw):raw.trim())}const vals=[...map.entries()].sort((a,b)=>a[1].localeCompare(b[1],'ja',{numeric:true}));return `<label>${label} ▼<select class="filter" onchange="filters['${k}']=this.value;draw()"><option value="">すべて</option>${vals.map(([key,name])=>`<option value="${esc(key)}" ${filters[k]===key?'selected':''}>${esc(name)}</option>`).join('')}</select></label>`}).join('')}
function visibleItem(x){if(view==='active'&&x.cancelled_at)return false;if(view==='unshipped'&&(x.cancelled_at||x.shipped_at))return false;if(view==='shipped'&&(x.cancelled_at||!x.shipped_at))return false;if(view==='cancelled'&&!x.cancelled_at)return false;return Object.entries(filters).every(([k,v])=>!v||filterCanon(itemValue(x,k))===v)}
function rowOrder(a,b){const ar=Number(a.source_row)||Number.MAX_SAFE_INTEGER,br=Number(b.source_row)||Number.MAX_SAFE_INTEGER;return ar-br||Number(a.id)-Number(b.id)}
function orderedVisibleItems(){const list=items.filter(visibleItem);return documents.flatMap(d=>list.filter(x=>Number(x.document_id)===Number(d.id)).sort(rowOrder))}
function draw(){const list=items.filter(visibleItem),ids=new Set(list.map(x=>Number(x.document_id)));const docs=documents.filter(d=>ids.has(Number(d.id))||(view==='cancelled'&&d.cancelled_at));countText.textContent=`表示 ${list.length}件 / 全${items.length}件`;document.getElementById('documents').innerHTML=docs.length?docs.map(d=>drawDoc(d,list.filter(x=>Number(x.document_id)===Number(d.id)))).join(''):'<div class="panel">該当データなし</div>'}
function drawDoc(d,rows){const cancelled=!!d.cancelled_at,temp=d.source_type==='manual_temp';rows=[...rows].sort(rowOrder);return `<details class="doc ${cancelled?'cancelled':''}" open><summary><span class="grow">注文日 ${esc(d.order_date||'未設定')}　<span class="badge">${rows.length}件</span> ${temp?'<span class="badge temp">仮登録・注文書待ち</span>':''} ${cancelled?'<span class="status cancel">取消済み</span>':''}</span><button class="btn no-print" onclick="event.preventDefault();editDocumentOrderDate(${d.id},'${esc(d.order_date||'')}')">注文日修正</button>${cancelled?`<button class="btn no-print" onclick="event.preventDefault();restoreDoc(${d.id})">復元</button>`:`<button class="btn red no-print" onclick="event.preventDefault();cancelDoc(${d.id})">この登録を取消</button>`}</summary><div class="doc-body"><div class="table-wrap"><table><thead><tr><th>発注番号</th><th>物件No.</th><th>納期</th><th>ユニット</th><th>部品コード</th><th>品名</th><th>注文数</th><th>出荷</th><th class="no-print">操作</th></tr></thead><tbody>${rows.map(drawItem).join('')}</tbody></table></div><div class="registered-time no-print">登録 ${new Date(d.created_at).toLocaleString('ja-JP')}</div></div></details>`}
function drawItem(x){const pending=Number(pendingShipId)===Number(x.id),ship=x.shipped_at?'O 出荷済':'X 未出荷';return `<tr class="${x.cancelled_at?'cancelled':''}"><td>${esc(x.order_no_norm)}</td><td>${esc(x.property_no)}</td><td>${esc(x.due_date||'')}</td><td>${esc(cleanUnit(x.unit_no))}</td><td>${esc(x.part_code_norm)}</td><td>${esc(cleanItemName(x.item_name))}</td><td>${Number(x.quantity)||0}</td><td><span class="print-only">${ship}</span><button class="btn no-print ${x.shipped_at?'green':''}" ${x.cancelled_at?'disabled':''} onclick="openShipConfirm(${x.id})">${ship}</button>${pending?`<div class="ship-confirm no-print"><button class="btn ${x.shipped_at?'':'green'}" onclick="toggleShip(${x.id},${x.shipped_at?'true':'false'})">${x.shipped_at?'未出荷に戻す':'出荷完了にする'}</button><button class="btn" onclick="closeShipConfirm()">閉じる</button></div>`:''}<div class="hint">${x.shipped_at?new Date(x.shipped_at).toLocaleDateString('ja-JP'):''}</div></td><td class="no-print"><button class="btn" ${x.cancelled_at?'disabled':''} onclick="openEdit(${x.id})">修正</button> ${x.cancelled_at?`<button class="btn" onclick="restoreItem(${x.id})">復元</button>`:`<button class="btn red" onclick="cancelItem(${x.id})">行取消</button>`}</td></tr>`}
function csv(v){return `"${String(v??'').replace(/"/g,'""')}"`}
function exportExcel(){const list=orderedVisibleItems(),head=['注文日','発注番号','物件No.','納期','ユニット','部品コード','品名','注文数','出荷状態'],body=list.map(x=>[itemValue(x,'order_date'),x.order_no_norm,x.property_no,x.due_date||'',cleanUnit(x.unit_no),x.part_code_norm,cleanItemName(x.item_name),Number(x.quantity)||0,x.shipped_at?'出荷済':'未出荷']);const text='\uFEFF'+[head,...body].map(r=>r.map(csv).join(',')).join('\r\n'),a=document.createElement('a');a.href=globalThis.URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download=`支給品一覧_${new Date().toISOString().slice(0,10)}.csv`;a.click();setTimeout(()=>globalThis.URL.revokeObjectURL(a.href),1000)}
async function patch(api,body){const r=await fetch(api,{method:'PATCH',headers:h(),body:JSON.stringify(body)});if(!r.ok)throw Error(await r.text());return r.json()}
async function cancelDoc(id){if(!confirm('この写真から登録した全データを取消しますか？'))return;try{const now=new Date().toISOString();await patch(`${DOC_API}?id=eq.${id}`,{cancelled_at:now,updated_at:now});await patch(`${ITEM_API}?document_id=eq.${id}&cancelled_at=is.null`,{cancelled_at:now,document_cancelled:true,updated_at:now});await loadData()}catch(e){alert(e.message)}}
async function restoreDoc(id){if(!confirm('この登録を復元しますか？'))return;try{const now=new Date().toISOString();await patch(`${DOC_API}?id=eq.${id}`,{cancelled_at:null,updated_at:now});await patch(`${ITEM_API}?document_id=eq.${id}&document_cancelled=eq.true`,{cancelled_at:null,document_cancelled:false,updated_at:now});await loadData()}catch(e){alert(e.message)}}
async function editDocumentOrderDate(id,current){const entered=prompt('注文日を入力してください（YYYY-MM-DD）',current||'');if(entered===null)return;const value=dateVal(entered);if(entered.trim()&&!value){alert('日付は YYYY-MM-DD 形式で入力してください');return}try{await patch(`${DOC_API}?id=eq.${id}`,{order_date:value||null,updated_at:new Date().toISOString()});await loadData()}catch(e){alert('注文日修正エラー: '+e.message)}}
async function cancelItem(id){if(!confirm('この行を取消しますか？'))return;try{await patch(`${ITEM_API}?id=eq.${id}`,{cancelled_at:new Date().toISOString(),document_cancelled:false,updated_at:new Date().toISOString()});await loadData()}catch(e){alert(e.message)}}
async function restoreItem(id){try{await patch(`${ITEM_API}?id=eq.${id}`,{cancelled_at:null,document_cancelled:false,updated_at:new Date().toISOString()});await loadData()}catch(e){alert(e.message)}}
function openShipConfirm(id){pendingShipId=Number(id);draw()}
function closeShipConfirm(){pendingShipId=null;draw()}
async function toggleShip(id,isShipped){try{pendingShipId=null;await patch(`${ITEM_API}?id=eq.${id}`,{shipped_at:isShipped?null:new Date().toISOString(),updated_at:new Date().toISOString()});await loadData()}catch(e){alert(e.message)}}
const EDIT=[['order_no_raw','発注番号'],['property_no','物件No.'],['due_date','納期','date'],['unit_no','ユニット'],['part_code_raw','部品コード'],['item_name','品名'],['quantity','注文数','number']];
function openEdit(id){const x=items.find(v=>Number(v.id)===Number(id));if(!x)return;editId.value=x.id;editFields.innerHTML=EDIT.map(([k,l,t])=>`<label class="${k==='item_name'?'wide':''}">${l}<input id="ef-${k}" type="${t||'text'}" value="${esc(x[k]??'')}"></label>`).join('');editModal.classList.add('open')}
function closeEdit(){editModal.classList.remove('open')}
async function saveEdit(){const id=Number(editId.value),old=items.find(v=>Number(v.id)===id),b={};EDIT.forEach(([k])=>b[k]=document.getElementById(`ef-${k}`).value);b.quantity=Number(b.quantity)||0;b.order_no_norm=norm(b.order_no_raw);b.order_prefix=prefix(b.order_no_raw);b.part_code_norm=norm(b.part_code_raw);b.unit_no=cleanUnit(b.unit_no);b.item_name=cleanItemName(b.item_name);b.due_date=b.due_date||null;b.updated_at=new Date().toISOString();try{await patch(`${ITEM_API}?id=eq.${id}`,b);closeEdit();await loadData()}catch(e){alert('修正エラー: '+e.message)}}
function masterItems(){const map=new Map();for(const x of items.filter(x=>!x.cancelled_at&&x.part_code_norm)){if(!map.has(x.part_code_norm))map.set(x.part_code_norm,x)}return [...map.values()].sort((a,b)=>String(a.part_code_norm).localeCompare(String(b.part_code_norm),'ja',{numeric:true}))}
function openManualOrder(){const masters=masterItems();manualMaster.innerHTML='<option value="">既存品目を選択してください</option>'+masters.map(x=>`<option value="${x.id}">${esc(x.part_code_norm)}　${esc(cleanItemName(x.item_name))}</option>`).join('');manualOrderDate.value=new Date().toISOString().slice(0,10);manualDueDate.value='';manualOrderNo.value='';manualProperty.value='';manualUnit.value='';manualPart.value='';manualName.value='';manualQty.value='1';manualModal.classList.add('open')}
function closeManualOrder(){manualModal.classList.remove('open')}
function fillManualMaster(){const x=items.find(v=>Number(v.id)===Number(manualMaster.value));if(!x)return;manualProperty.value=x.property_no||'';manualUnit.value=cleanUnit(x.unit_no);manualPart.value=x.part_code_norm||x.part_code_raw||'';manualName.value=cleanItemName(x.item_name)}
async function saveManualOrder(){const row=cleanDraft({order_no:manualOrderNo.value,property_no:manualProperty.value,due_date:manualDueDate.value,unit_no:manualUnit.value,part_code:manualPart.value,item_name:manualName.value,quantity:manualQty.value});if(!norm(row.part_code)||!row.item_name){alert('既存品目を選択するか、部品コードと品名を入力してください');return}if(!confirm('この注文を仮登録しますか？'))return;try{const dr=await fetch(DOC_API,{method:'POST',headers:h(),body:JSON.stringify({source_type:'manual_temp',original_name:null,order_date:manualOrderDate.value||null})});if(!dr.ok)throw Error(await dr.text());const doc=(await dr.json())[0],ir=await fetch(ITEM_API,{method:'POST',headers:h(),body:JSON.stringify([rowPayload(row,doc.id,1)])});if(!ir.ok)throw Error(await ir.text());closeManualOrder();await loadData();alert('仮登録しました')}catch(e){alert('仮登録エラー: '+e.message)}}
function tempItems(){const tempIds=new Set(documents.filter(d=>d.source_type==='manual_temp'&&!d.cancelled_at).map(d=>Number(d.id)));return items.filter(x=>tempIds.has(Number(x.document_id))&&!x.cancelled_at&&!x.shipped_at)}
function openReplace(i){const temps=tempItems();replaceRowIndex.value=i;if(!temps.length){alert('入替できる仮登録がありません');return}replaceChoices.innerHTML=temps.map(x=>{const d=documents.find(v=>Number(v.id)===Number(x.document_id));return `<div class="panel"><b>${esc(x.part_code_norm)}　${esc(cleanItemName(x.item_name))}</b><div class="hint">注文日 ${esc(d?.order_date||'未設定')} ／ 納期 ${esc(x.due_date||'未設定')} ／ 数量 ${Number(x.quantity)||0}</div><button class="btn purple" style="margin-top:8px" onclick="chooseReplace(${x.id})">この仮登録と入替</button></div>`}).join('');replaceModal.classList.add('open')}
function closeReplace(){replaceModal.classList.remove('open')}
function chooseReplace(id){const i=Number(replaceRowIndex.value);currentPage().draft[i].replaceId=Number(id);currentPage().confirmed=false;closeReplace();drawDraft()}
loadData();
</script></body></html>
